# The console's checks. It does not build the Rust binary: the two halves of VoxLoop ship as
# one artefact but they break in different ways, and a Rust compile in front of a formatting
# check would make the fast half wait for the slow one.
name: Console

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, lint and the seam test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Each of these fails the build on its own, and they run whatever the one before did,
      # so a lint error does not hide behind a stray space.
      - run: npm run format:check

      - run: npm run lint
        if: ${{ !cancelled() }}

      - run: npm test
        if: ${{ !cancelled() }}
