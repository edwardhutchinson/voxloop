[package]
name = "voxloop"
version = "0.1.0"
edition = "2024"
publish = false

# ADR-0036 / ADR-0061: one binary crate, module boundaries per seam, no workspace.
# There is no library target on purpose — a module's tests live with the module and
# go through its interface, so nothing needs to reach in from `tests/`.

[features]
default = []
# ADR-0037: the client bundle is embedded only by the release build, so a bare
# `cargo build` never needs Node or a completed `npm run build`.
embed-web = ["dep:rust-embed"]

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
getrandom = "0.4.0"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
# The signalling channel, driven from the outside: `futures-util` is the sink and stream the
# client half is written against, and `tokio-tungstenite` is the framing. Both are already in
# the tree — axum's `ws` feature brings them — and neither is reached for by the product.
futures-util = { version = "0.3", default-features = false }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.29", default-features = false }
tower = { version = "0.5.3", features = ["util"] }

# Argon2id is deliberately expensive, and an unoptimised build makes it expensive enough to
# dominate the test suite. Optimising the two crates that do the work leaves every test
# exercising the real parameters without waiting seconds for each one.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
